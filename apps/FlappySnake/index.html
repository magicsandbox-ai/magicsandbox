<div
  class="flex h-screen touch-none flex-col items-center justify-center bg-stone-100 p-4"
>
  <div>
    <div id="title-bar" class="mb-1 flex w-full items-center md:text-xl">
      <div class="flex-1 font-bold">
        <span class="text-[#FF0000]">Flappy</span
        ><span class="text-[#7BC043]">Snake!</span>
      </div>
      <div id="score-display" class="text-center">
        Score: <span id="score">0</span>
      </div>
      <div id="high-score-display" class="flex-1 text-right">
        High Score: <span id="high-score">0</span>
      </div>
    </div>
    <div class="relative">
      <canvas
        id="flappy-canvas"
        class="border-2 border-stone-500 shadow-md"
      ></canvas>
      <div
        id="instructions-overlay"
        class="absolute inset-0 flex flex-col items-center justify-center space-y-3 bg-black bg-opacity-70 text-center text-xl font-medium text-white"
      >
        <p id="jump-instruction"></p>
        <p id="snake-instruction"></p>
        <p id="start-instruction"></p>
      </div>
    </div>
  </div>
</div>
